# Coolify: New Resource -> Docker Compose (empty) -> paste this file.
# Assign your domain to the "frontend" service (port 80). The backend stays internal;
# the frontend's nginx proxies /api/* to it, so no CORS setup is needed.
services:
  backend:
    image: ghcr.io/termlyuofl/termly-backend:latest
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      # Default is the SQLite DB baked into the image. Uncomment for MariaDB:
      # - DATABASE_URL=mysql+pymysql://termly:${MARIADB_PASSWORD}@mariadb:3306/termly
      - GUNICORN_CMD_ARGS=--bind 0.0.0.0:5000 --workers 3 --access-logfile -
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/termlyuofl/termly_proj:latest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_FRONTEND_80
      - BACKEND_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
